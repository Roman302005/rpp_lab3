services:
  parking:
    build: .
    image: parking-lab3:latest
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
